  --canvas: #080C18; --workspace: #0B1020; --surface: #141B30; --muted: #1A2340;
  --text: #E6E9F2; --text-2: #A9BBFF; --text-3: #8FA0D6; --divider: #2A3558;
  --shimmer-base: #1A2340; --shimmer-hi: #2A3558; --toast: #2A3558; --mark: rgba(51,92,255,0.35);
  --scrim: rgba(0,0,0,0.6);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.4); --shadow-hover: 0 6px 16px rgba(0,0,0,0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--workspace); color: var(--text); font-family: var(--font-body); font-size: 12.6px; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100%; }

/* Sidebar */
.sidebar { position: sticky; top: 0; height: 100dvh; background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); padding: 22px 12px 14px; display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--sidebar-text-active); padding-left: 8px; }

/* The Effective AI mark (blue-teal figure with an open book) replaces the old book icon. */
.brand-mark svg { display: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 18px; white-space: nowrap; }
.streak { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--violet-pale-hover); background: var(--violet-pale); color: var(--violet); font-weight: 600; }
.nav-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; }
.group-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; color: var(--navy-text); opacity: .7; margin: 12px 0 4px 14px; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; border: 0; background: transparent; color: var(--sidebar-text); font-weight: 600; font-size: 12.6px; text-align: left; width: 100%; transition: background .2s, color .2s; }
.nav-btn:hover { background: var(--sidebar-hover); }
.nav-btn[aria-current="page"] { background: var(--sidebar-active); color: var(--sidebar-text-active); }
.nav-btn[aria-current="page"] svg { color: var(--violet-muted); }
.nav-btn .badge { margin-left: auto; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--violet-pale-hover); color: var(--violet-dark); font-size: 10.8px; font-weight: 700; display: grid; place-items: center; flex: none; }
.side-foot { border-top: 1px solid var(--sidebar-border); margin: 10px -12px 0; padding: 10px 12px 0; display: flex; flex-direction: column; gap: 2px; }
.user { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-left: 8px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--violet); color: #fff; font-weight: 700; display: grid; place-items: center; flex: none; }
.user > div { flex: 1; min-width: 0; }
.user-name { color: var(--sidebar-text-active); font-size: 12.6px; font-weight: 600; }
.user-mail { color: var(--navy-text); font-size: 10.8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ghost-icon { border: 0; background: none; color: var(--navy-text); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.ghost-icon:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
.appbar, .scrim { display: none; }

/* Main */
main { min-width: 0; padding-block: 32px 56px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); perspective: 1600px; overflow-x: clip; }
.page { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.reveal { animation: slideUp .9s var(--ease) both; }
@keyframes slideUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
.page.turn-in { transform-origin: left center; animation: turnIn .55s cubic-bezier(.2,.8,.2,1) both; }
.page.turn-in .reveal { animation: none; }
@keyframes turnIn { from { opacity: 0; transform: rotateY(-38deg) translateX(-12px); } to { opacity: 1; transform: none; } }

h1 { font-family: var(--font-display); font-weight: 600; font-size: 30.6px; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
.display { font-family: var(--font-display); font-weight: 600; font-size: 21.6px; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 17.1px; font-weight: 700; margin: 6px 0 -6px; }
h3 { font-size: 14.4px; font-weight: 700; margin: 0; }
.lede { margin: 0; color: var(--text-2); font-size: 13.5px; max-width: 72ch; }
.sub { color: var(--text-2); font-size: 11.7px; margin: 2px 0 0; }
.muted { color: var(--text-2); }
.subtle { color: var(--text-3); font-size: 10.8px; }
.mono { font-family: var(--font-mono); font-size: 9.9px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row-flex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1; min-width: 0; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 260px), 1fr)); }
.grid > * { min-width: 0; }
.panel { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-card); padding: 22px; min-width: 0; }
.panel.tight { padding: 16px; }
.card-btn { text-align: left; border: 1px solid var(--divider); background: var(--surface); border-radius: 16px; padding: 18px; display: flex; gap: 12px; align-items: flex-start; transition: box-shadow .2s, transform .2s; width: 100%; }
.card-btn:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.icon-tile { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.stat { padding: 20px; }
.stat-value { font-family: var(--font-display); font-weight: 600; font-size: 27px; margin-top: 14px; line-height: 1.15; font-variant-numeric: tabular-nums; }

.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; background: var(--violet); color: #fff; display: inline-flex; align-items: center; gap: 8px; transition: background .2s; white-space: nowrap; justify-content: center; }
.btn:hover { background: var(--violet); filter: brightness(0.92); }
.btn:disabled { background: var(--divider); color: var(--text-3); }
.btn.outline { background: transparent; color: var(--violet-dark); border: 1px solid var(--divider); }
.btn.outline:hover { background: var(--violet-pale); }
.btn.tonal { background: var(--violet-pale); color: var(--violet-dark); }
.btn.tonal:hover { background: var(--violet-pale-hover); }
.btn.text { background: transparent; color: var(--violet-dark); padding-inline: 10px; }
.btn.small { padding: 7px 14px; font-size: 11.7px; }
.right { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 10.8px; font-weight: 600; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--divider); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: 11.7px; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, border-color .2s; }
.chip[aria-pressed="true"] { background: var(--violet-pale); border-color: var(--violet); color: var(--violet-dark); }
.chip.solid[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
.chip.topic { background: var(--violet-pale); border-color: transparent; color: var(--violet-dark); }
.chip.topic:hover { background: var(--violet-pale-hover); }
.seg { display: inline-flex; border: 1px solid var(--divider); border-radius: 999px; overflow: hidden; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: var(--surface); padding: 9px 16px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--divider); }
.seg button[aria-pressed="true"] { background: var(--violet-pale); color: var(--violet-dark); }

.field { width: 100%; font-size: 16px; padding: 12px 14px; border: 1px solid var(--divider); border-radius: 12px; background: var(--muted); color: var(--text); }
.field.card-bg { background: var(--surface); }
.field:focus { outline: none; border-color: var(--violet); }
textarea.field { resize: vertical; min-height: 80px; line-height: 1.5; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search .field { padding-left: 40px; }

.bar { height: 6px; border-radius: 6px; overflow: hidden; position: relative; }
.bar::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .12; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: currentColor; transition: width 1.2s var(--ease); position: relative; }
.bar.thick { height: 8px; }

.mrow { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
.mrow + .mrow { border-top: 1px solid var(--divider); }
.mrow .label { display: flex; gap: 8px; align-items: baseline; margin-bottom: 7px; flex-wrap: wrap; }

.src { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--muted); border-radius: 12px; padding: 9px 12px; margin-top: 8px; }
.src:hover { background: var(--violet-pale); }
.src .t { font-weight: 600; font-size: 11.7px; }
.cite { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--violet-pale); color: var(--violet-dark); font-size: 9.9px; font-weight: 700; border: 0; padding: 0; vertical-align: middle; flex: none; }
mark { background: var(--mark); color: inherit; font-weight: 700; border-radius: 2px; padding: 0 1px; }
.quote { border-left: 3px solid var(--violet); background: var(--muted); padding: 12px 14px; line-height: 1.6; font-size: 13.5px; }

.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--divider); background: transparent; margin-top: 8px; }
.opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--text-3); flex: none; display: grid; place-items: center; }
.opt.picked { border-color: var(--violet); background: var(--violet-pale); }
.opt.picked .radio { border-color: var(--violet); }
.opt.picked .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--violet); }
.opt.correct { border-color: var(--green); background: var(--green-pale); }
.opt.correct .radio { border-color: var(--green); background: var(--green); }
.opt.wrong { border-color: var(--red); background: var(--red-pale); }
.opt.wrong .radio { border-color: var(--red); background: var(--red); }
.opt:disabled { cursor: default; color: var(--text); }

.stepbar { display: flex; gap: 8px; flex-wrap: wrap; }
.step { padding: 6px 12px; border-radius: 999px; font-size: 10.8px; font-weight: 600; background: var(--muted); color: var(--text-2); }
.step.now { background: var(--violet); color: #fff; }
.step.done { background: var(--green-pale); color: var(--green-ink); }
.num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--violet-pale); color: var(--violet-dark); font-weight: 700; flex: none; font-size: 11.7px; }

.kmap { position: relative; height: 420px; }
.kmap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.knode { position: absolute; transform: translate(-50%, -50%); width: 108px; min-height: 42px; border-radius: 999px; border: 2px solid; background: var(--surface); color: var(--text); font-weight: 600; font-size: 10.8px; line-height: 1.2; padding: 6px 8px; box-shadow: var(--shadow-card); }
.knode.sel { background: var(--violet); color: #fff; box-shadow: var(--shadow-violet); }
.legend { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: 10.8px; color: var(--text-2); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: -1px; }

.bubble { max-width: min(520px, 88%); padding: 10px 14px; border-radius: 14px; line-height: 1.5; background: var(--muted); }
.bubble.me { align-self: flex-end; background: var(--violet-pale); }
.chat { display: flex; flex-direction: column; gap: 10px; }

details.acc { border-top: 1px solid var(--divider); }
details.acc:first-child { border-top: 0; }
details.acc summary { list-style: none; cursor: pointer; padding: 14px 4px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; color: var(--violet); font-weight: 700; font-size: 16.2px; line-height: 1; }
details.acc[open] summary::after { content: "–"; }
details.acc .body { padding: 0 4px 14px; }

.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; background: var(--divider); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
.switch[aria-checked="true"] { background: var(--violet); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.list-row + .list-row { border-top: 1px solid var(--divider); }
.check { width: 20px; height: 20px; accent-color: var(--violet); flex: none; }
.day-label { font-family: var(--font-mono); font-size: 9.9px; color: var(--text-3); letter-spacing: 0.12em; text-transform: uppercase; margin: 6px 4px -10px; display: flex; justify-content: space-between; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-mono); font-size: 9px; fill: var(--text-3); }
.chart text.day { font-family: var(--font-body); font-size: 10.8px; }
.stars { display: flex; gap: 2px; }
.stars button { border: 0; background: none; padding: 2px; color: var(--amber); }

.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal .panel { width: min(520px, 100%); max-height: calc(100% - 32px); overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--toast); color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow-hover); font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s var(--ease); max-width: calc(100% - 32px); z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Loading: book loader over a shimmering outline */
.loading { position: relative; }
.sk { background: linear-gradient(90deg, var(--shimmer-base) 30%, var(--shimmer-hi) 50%, var(--shimmer-base) 70%); background-size: 200% 100%; animation: shimmer 1.5s ease infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.sk-title { width: min(260px, 70%); height: 34px; } .sk-line { width: min(340px, 90%); height: 16px; margin-top: -10px; }
.sk-card { height: 120px; border-radius: 16px; } .sk-card.tall { height: 180px; }
.book-card { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-hover); padding: 30px 36px 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.book-card p { margin: 0; color: var(--text-2); font-weight: 600; white-space: nowrap; }
.book { position: relative; width: 112px; height: 73px; perspective: 600px; }
.book::after { content: ""; position: absolute; left: 55px; top: 4px; bottom: 4px; width: 2px; background: var(--divider); }
.bpage { position: absolute; top: 0; width: 56px; height: 73px; background: var(--surface); border: 1px solid var(--divider); display: flex; flex-direction: column; justify-content: space-evenly; padding: 10px 8px 10px 10px; }
.bpage.left { left: 0; border-radius: 8px 0 0 8px; padding: 10px 10px 10px 8px; }
.bpage.right { left: 56px; border-radius: 0 8px 8px 0; }
.bpage i { display: block; height: 6px; border-radius: 3px; background: var(--shimmer-base); position: relative; overflow: hidden; }
.bpage i:nth-child(even) { width: 70%; }
.bpage i::after { content: ""; position: absolute; inset: 0; background: var(--c); transform-origin: left; }
.bpage.right i::after { transform: scaleX(0); animation: inkFill 1.4s cubic-bezier(.65,0,.35,1) infinite; }
.bpage.right i:nth-child(2)::after { animation-delay: .1s; } .bpage.right i:nth-child(3)::after { animation-delay: .2s; } .bpage.right i:nth-child(4)::after { animation-delay: .3s; }
@keyframes inkFill { 0% { transform: scaleX(0); } 70%, 100% { transform: scaleX(1); } }
.turning { position: absolute; left: 56px; top: 0; width: 56px; height: 73px; transform-origin: left center; transform-style: preserve-3d; animation: pageTurn 1.4s cubic-bezier(.65,0,.35,1) infinite; }
.turning .bpage { left: 0; backface-visibility: hidden; box-shadow: 0 0 8px rgba(0,0,0,0.15); }
.turning .bpage.back { transform: rotateY(180deg); border-radius: 8px 0 0 8px; }
.turning .bpage.front i::after { transform: scaleX(0); }
@keyframes pageTurn { from { transform: rotateY(0deg); } to { transform: rotateY(-180deg); } }

/* Landing page before sign-up (mirrors lib/screens/welcome_screen.dart). Light by default: black
   (#000000) text, icons and accents on white. Dark when the visitor chooses it: light text over a near-black background. */
.welcome {
  --lp-bg: #FFFFFF; --lp-panel: #F7F7F7; --lp-panel-2: #F2F2F2; --lp-deep: #FAFAFA; --lp-line: #E2E2E2;
  --lp-text: #000000; --lp-soft: #000000; --lp-heading: #000000; --lp-violet: #000000; --lp-violet-2: #000000; --lp-lilac: #000000;
  --lp-dot: #CFCFCF; --lp-track: #E4E4E4; --lp-stage: #F0F0F0; --lp-nav: rgba(255,255,255,0.9);
  --lp-mission: linear-gradient(135deg, #F5F5F5 0%, #EAEAEA 55%, #F2F2F2 100%); --lp-mission-text: #000000;
  --lp-pill: rgba(0,0,0,0.1); --lp-shadow: 0 24px 60px rgba(0,0,0,0.12);
  --lp-grad: linear-gradient(90deg, #000000, #000000);
  --violet: #000000; --shadow-violet: 0 4px 20px rgba(0,0,0,0.3);
  --lp-tint-rgb: 0 0 0; /* tints are grey in light mode, blue in dark */
  min-height: 100%; background: var(--lp-bg); color: var(--lp-text); color-scheme: light; overflow-x: clip;
}
:root[data-theme="dark"] .welcome {
  --lp-tint-rgb: 51 92 255;
  --lp-bg: #0A0D16; --lp-panel: #121726; --lp-panel-2: #171D2F; --lp-deep: #0E1220; --lp-line: #232B44;
  --lp-text: #E6E9F2; --lp-soft: #A9B0C7; --lp-heading: #FFFFFF; --lp-violet: #335CFF; --lp-violet-2: #5C7DFF; --lp-lilac: #A9BBFF;
  --lp-dot: #2A3350; --lp-track: #262E48; --lp-stage: #161B2B; --lp-nav: rgba(10,13,22,0.86);
  --lp-mission: linear-gradient(135deg, #1B2347 0%, #1F3170 55%, #1B2C52 100%); --lp-mission-text: #CDD2E4;
  --lp-pill: rgba(255,255,255,0.08); --lp-shadow: 0 30px 90px rgba(0,0,0,0.55);
  --lp-grad: linear-gradient(90deg, #5C7DFF, #A9BBFF);
  color-scheme: dark;
}
.lp-theme { background: none; border: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--lp-heading); }
.lp-theme:hover { background: var(--lp-pill); }
.welcome h1, .welcome h2, .welcome h3, .welcome p { margin: 0; }
.welcome [id] { scroll-margin-top: 84px; }
.lp-nav { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 24px; padding-block: 14px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); background: var(--lp-nav); backdrop-filter: blur(12px); border-bottom: 1px solid var(--lp-line); }
.lp-nav .brand-name { color: var(--lp-heading); }
.lp-links { display: flex; gap: 32px; margin: 0 auto; }
.lp-links button, .lp-login { background: none; border: 0; padding: 8px 4px; color: var(--lp-soft); font-weight: 500; font-size: 13.5px; }
.lp-links button:hover { color: var(--lp-heading); }
.lp-actions { display: flex; align-items: center; gap: 10px; }
.lp-login { color: var(--lp-heading); font-weight: 600; padding-inline: 10px; }
.lp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 12px; padding: 16px 28px; font-size: 15.3px; font-weight: 600; background: var(--lp-violet); color: #fff; box-shadow: 0 10px 40px rgb(var(--lp-tint-rgb) / 0.35); transition: filter .2s, transform .2s; white-space: nowrap; }
.lp-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.lp-btn.ghost { background: var(--lp-deep); color: var(--lp-heading); border: 1px solid var(--lp-line); box-shadow: none; }
.lp-btn.small { padding: 10px 16px; font-size: 12.6px; border-radius: 10px; box-shadow: none; }
.lp-top { background: var(--lp-bg); }
.lp-hero { text-align: center; max-width: 1100px; margin: 0 auto; padding: 64px 24px 8px; }
.lp-pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; border: 1px solid rgb(var(--lp-tint-rgb) / 0.35); background: rgb(var(--lp-tint-rgb) / 0.1); color: var(--lp-lilac); font-weight: 600; font-size: 12.6px; }
.lp-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--lp-violet-2); }
.lp-h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28.8px, 4.3vw, 52.2px); line-height: 1.04; letter-spacing: -0.02em; margin: 26px auto 0 !important; max-width: 15ch; color: var(--lp-heading); text-wrap: balance; }
.grad { background: var(--lp-grad, linear-gradient(90deg, var(--violet), var(--violet))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lp-sub { font-size: clamp(14.4px, 1.4vw, 18px); color: var(--lp-soft); line-height: 1.6; max-width: 62ch; margin: 22px auto 0 !important; }
.lp-facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 24px; margin-top: 22px; color: var(--lp-soft); font-size: 13.5px; }
.lp-facts span { display: inline-flex; align-items: center; gap: 8px; }
.lp-facts svg, .lp-note svg { color: var(--lp-violet-2); }
.lp-ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 30px; }
/* Product showcase: a window onto the app */
.lp-show { max-width: 1180px; margin: 48px auto 0; padding: 0 24px; }
.lp-frame { background: var(--lp-deep); border: 1px solid var(--lp-line); border-radius: 22px; overflow: hidden; box-shadow: var(--lp-shadow); text-align: left; }
.lp-dots { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--lp-line); }
.lp-dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--lp-dot); }
.lp-app { display: grid; grid-template-columns: 200px minmax(0, 1fr) 270px; min-height: 430px; font-size: 11.7px; }
.lp-app-side { background: var(--lp-panel); border-right: 1px solid var(--lp-line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.lp-app-side .brand { padding: 0 6px 10px; } .lp-app-side .brand-mark { width: 28px; height: 28px; border-radius: 8px; } .lp-app-side .brand-name { font-size: 14.4px; }
.lp-lbl { font-size: 9.9px; color: var(--lp-soft); margin: 12px 8px 4px; }
.lp-ni { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--lp-text); }
.lp-ni.on { background: rgb(var(--lp-tint-rgb) / 0.2); }
.lp-app-main { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.lp-app-chat { border-left: 1px solid var(--lp-line); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.lp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lp-grow { flex: 1; min-width: 0; }
.lp-muted { color: var(--lp-soft); }
.lp-bub { padding: 10px 12px; border-radius: 12px; background: var(--lp-panel-2); line-height: 1.55; }
.lp-bub.me { align-self: flex-end; background: var(--lp-violet); color: #fff; }
.lp-card { background: var(--lp-panel-2); border: 1px solid var(--lp-line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.lp-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--lp-line); border-radius: 10px; }
.lp-opt.ok { border-color: var(--lp-violet-2); background: rgb(var(--lp-tint-rgb) / 0.14); }
.lp-radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--lp-violet-2); flex: none; display: grid; place-items: center; color: var(--lp-bg); }
.lp-opt.ok .lp-radio { background: var(--lp-violet-2); }
.lp-tag, .lp-cite { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: rgb(var(--lp-tint-rgb) / 0.18); color: var(--lp-lilac); font-size: 9.9px; font-weight: 600; white-space: nowrap; }
.lp-chipbtn { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--lp-line); color: var(--lp-text); font-size: 10.8px; }
.lp-bar { height: 8px; border-radius: 4px; background: var(--lp-track); overflow: hidden; }
.lp-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--lp-violet), var(--lp-violet-2)); }
.lp-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.lp-tile { background: var(--lp-panel-2); border: 1px solid var(--lp-line); border-radius: 14px; padding: 14px; text-align: center; }
.lp-tile svg { color: var(--lp-violet-2); }
.lp-tile b { display: block; font-family: var(--font-display); font-size: 21.6px; color: var(--lp-heading); margin-top: 6px; }
.lp-tile span { font-size: 9.9px; letter-spacing: .08em; text-transform: uppercase; color: var(--lp-soft); }
.lp-carousel { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
.lp-carousel button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 999px; background: var(--lp-dot); transition: width .3s var(--ease); }
.lp-carousel button[aria-current="true"] { width: 36px; background: var(--lp-violet-2); }
/* Feature sections, alternating copy and picture */
.lp-feature { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; max-width: 1200px; margin: 0 auto; padding: 80px 24px; }
.lp-feature.flip .lp-copy { order: 2; }
.lp-badge { display: inline-block; padding: 6px 16px; border-radius: 999px; background: rgb(var(--lp-tint-rgb) / 0.16); color: var(--lp-lilac); font-weight: 700; font-size: 12.6px; letter-spacing: .06em; text-transform: uppercase; }
.lp-h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(23.4px, 2.9vw, 37.8px); line-height: 1.08; letter-spacing: -0.015em; margin-top: 20px !important; color: var(--lp-heading); text-wrap: balance; }
.lp-copy > p { color: var(--lp-soft); font-size: clamp(14.4px, 1.4vw, 18px); line-height: 1.6; margin: 20px 0 30px !important; max-width: 46ch; }
.lp-note { display: flex; align-items: center; gap: 8px; color: var(--lp-soft); margin-top: 24px; font-size: 13.5px; }
.lp-stage { background: var(--lp-stage); border-radius: 24px; padding: 14px; }
.lp-stage .lp-frame { box-shadow: none; }
.lp-stage .lp-body { padding: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 11.7px; }
.lp-cap { font-size: 10.8px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--lp-soft); }
.lp-mission { max-width: 1200px; margin: 40px auto; padding: 0 24px; }

/* ═══ Engine (lib/services/knowledge_engine.dart) ═══ */
const STOP = new Set('the and for are but not you your with that this what how why when does did can its into from about which who was were has have had will would should could there their them then than they use used using explain tell mean means work works make makes more most some each all any one two'.split(' '));
const stem = w => { w = w.toLowerCase(); if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y'; if (w.length > 4 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1); return w; };
const terms = t => (t.toLowerCase().match(/[a-zλ]+/g) || []).map(stem).filter(w => w.length > 2 && !STOP.has(w));
function search(query, docIds) {
  const q = new Set(terms(query)); if (!q.size) return [];
  const hits = [];
  for (const p of PASSAGES) {
    if (docIds && !docIds.has(p.docId)) continue;
    const pt = new Set(terms(p.section + ' ' + p.text));
    const matched = [...q].filter(t => pt.has(t));
    let score = matched.length;
    for (const id of p.concepts) { const nt = terms(concept(id).name); if (nt.length && nt.every(t => q.has(t))) score += 2; }
    if (score > 0) hits.push({ p, score, terms: new Set(matched) });
  }
  return hits.sort((a, b) => b.score - a.score);
}
function answer(question, docIds) {
  const hits = search(question, docIds); if (!hits.length) return { parts: [], sources: [] };
  const chosen = hits.filter(h => h.score >= hits[0].score / 2).slice(0, 3);
  const q = new Set(terms(question));
  const parts = chosen.map((h, i) => {
    const sentences = h.p.text.split(/(?<=[.!?])\s+/);
    let best = sentences[0], bs = -1;
    for (const s of sentences) { const sc = terms(s).filter(t => q.has(t)).length; if (sc > bs) { best = s; bs = sc; } }
    return [best, i];
  });
  return { parts, sources: chosen.map(h => h.p) };
}
const evaluate = (r, text) => r.points.map(pt => pt[1].some(k => text.toLowerCase().includes(k)));
function analysePapers() {
  const ids = new Set(L.docs.filter(d => d.type === 'exam' && d.indexed).map(d => d.id));
  const ps = PASSAGES.filter(p => ids.has(p.docId));
  const topics = CONCEPTS.map(c => { const qs = ps.filter(p => p.concepts.includes(c.id)); return { c, papers: new Set(qs.map(p => p.docId)).size, marks: qs.reduce((s, p) => s + marksOf(p), 0), qs }; })
    .filter(t => t.qs.length).sort((a, b) => b.papers - a.papers || b.marks - a.marks);
  const words = Object.entries(COMMAND_WORDS).map(([k, ws]) => [k, ps.filter(p => ws.some(w => p.text.toLowerCase().includes(w))).length]).filter(e => e[1]).sort((a, b) => b[1] - a[1]);
  return { paperCount: ids.size, questionCount: ps.length, topics, words };
}
function highlight(text, set) {
  if (!set || !set.size) return esc(text);
  return text.replace(/[A-Za-zλ]+|[^A-Za-zλ]+/g, m => /[A-Za-zλ]/.test(m[0]) && set.has(stem(m)) ? `<mark>${esc(m)}</mark>` : esc(m));
}

/* ═══ Planner (lib/services/study_planner.dart) ═══ */
function buildPlan() {
  const wd = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const label = i => i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : wd[new Date(Date.now() + i * DAY).getDay()];
  const weight = c => (1 - (mastery(c.id) ?? 0.3)) * (1 + examFreq(c.id));
  const ranked = [...CONCEPTS].sort((a, b) => weight(b) - weight(a));
  const queue = [];
  for (let round = 0; round < 3; round++) for (const c of ranked) {
    const gap = isGap(c.id), papers = examFreq(c.id), repeats = gap ? (papers > 0 ? 3 : 2) : 1;
    if (round >= repeats) continue;
    const m = mastery(c.id);
    queue.push(gap
      ? { key: c.id + '-' + round, kind: 'study', cid: c.id, minutes: 20, title: ['Study session: ', 'Practise: ', 'Past-paper question: '][round] + c.name, reason: [m == null ? 'Not tested yet' : 'Mastery ' + pct(m), papers ? `in ${papers} past paper${papers === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ') }
      : { key: c.id + '-review', kind: 'review', cid: c.id, minutes: 10, title: 'Quick review: ' + c.name, reason: `Strong at ${pct(m)}; a short review keeps it that way` });
  }
  const days = []; let next = 0;
  for (let d = 0; d < 7; d++) {
    const items = [];
    if (d === 5) items.push({ key: 'mock', kind: 'mock', minutes: 30, title: 'Mock test', reason: 'Check your progress under exam conditions' });
    else { let left = L.dailyGoal; while (next < queue.length && (queue[next].minutes <= left || !items.length)) { const it = queue[next++]; items.push(it); left -= it.minutes; } }
    days.push({ label: label(d), items });
  }
  return { days, unscheduled: queue.length - next };
}

function barChart() {
  const W = 560, H = 220, Lp = 36, R = 8, T = 10, B = 30, maxY = Math.ceil(Math.max(...WEEKLY.map(d => d[1]))) + 1;
  const y = v => T + (H - T - B) * (1 - v / maxY), step = (W - Lp - R) / WEEKLY.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Study hours per day this week"><defs><linearGradient id="bg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:${V.violetDark}"/><stop offset="1" style="stop-color:${V.violetLight}"/></linearGradient></defs>`;
  for (let t = 0; t <= maxY; t++) s += `<line x1="${Lp}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--divider)"/><text x="${Lp - 8}" y="${y(t) + 3}" text-anchor="end">${t}h</text>`;
  WEEKLY.forEach(([d, v], i) => { const cx = Lp + step * i + step / 2, top = y(v); s += `<path d="M${cx - 10} ${y(0)}V${top + 6}a6 6 0 0 1 6 -6h8a6 6 0 0 1 6 6V${y(0)}Z" fill="url(#bg)"><title>${d}: ${v}h</title></path><text class="day" x="${cx}" y="${H - 8}" text-anchor="middle">${d}</text>`; });
  return s + '</svg>';
}
function lineChart() {
  const W = 560, H = 220, Lp = 36, R = 12, T = 10, B = 30, min = 60, max = 100;
  const x = i => Lp + (W - Lp - R) * i / (QUIZ.length - 1), y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const pts = QUIZ.map((v, i) => [x(i), y(v)]); let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2; d += `C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`; }
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average quiz score over 8 weeks, from 72 to 88"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${V.violet}" stop-opacity=".25"/><stop offset="1" style="stop-color:${V.violet}" stop-opacity="0"/></linearGradient></defs>`;
  for (let t = min; t <= max; t += 10) s += `<line x1="${Lp}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--divider)"/><text x="${Lp - 8}" y="${y(t) + 3}" text-anchor="end">${t}</text>`;
  s += `<path d="${d}L${x(QUIZ.length - 1)} ${y(min)}L${Lp} ${y(min)}Z" fill="url(#lg)"/><path d="${d}" fill="none" style="stroke:${V.violet}" stroke-width="3" stroke-linecap="round"/>`;

screens.ask = () => {

  let out = `${head('Ask My Knowledge', 'Answers come only from the materials you choose, with the exact source for every point.')}
  <form class="panel stack reveal" id="ask-form"><strong>Answer from</strong>${docChips('askDoc', a.sel)}
    <textarea class="field" id="ask-input" data-bind="ask.text" rows="2" placeholder="Ask a question about your materials" aria-label="Your question">${esc(a.text)}</textarea>
    <div class="chips">${sugg.map(s => `<button type="button" class="chip topic" data-act="askPreset" data-arg="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="right"><button class="btn" type="submit">${icon('sparkles', 18)}Ask</button></div></form>`;

    out += `<div class="panel reveal"><div class="row-flex" style="flex-wrap:nowrap;align-items:flex-start"><span style="color:var(--violet)">${icon('chat')}</span><h3 class="grow">${esc(a.question)}</h3></div>`;

      <p style="font-size:13.5px;line-height:1.75;margin:12px 0 0">${a.ans.parts.map(([s, i]) => `${esc(s)} <button class="cite" data-act="source" data-arg="${a.ans.sources[i].id}" data-hl="${esc([...hl].join(','))}" aria-label="Source ${i + 1}">${i + 1}</button>`).join('&nbsp; ')}</p>
      <h3 style="margin-top:18px">Sources</h3>${a.ans.sources.map((p, i) => srcTile(p.id, i + 1, hl)).join('')}

screens.search = () => {
  const s = S.search;
  let out = `${head('Search & Explore', 'Find any idea across your whole library, or explore a topic from every angle.')}${tabs('searchTab', ['Smart search', 'Topic explorer'], s.tab)}`;
  if (s.tab === 0) return out + `<label class="search">${icon('search', 18)}<input class="field card-bg" id="search-input" data-bind="search.q" value="${esc(s.q)}" placeholder="Search concepts across every document" aria-label="Search"></label><div class="stack" id="search-results">${searchResults()}</div>`;
  const c = concept(s.topic), found = passagesFor(s.topic), byDoc = {};
  found.forEach(p => (byDoc[p.docId] ||= []).push(p));
  return out + `<div class="chips">${CONCEPTS.map(x => `<button class="chip" data-act="topic" data-arg="${x.id}" aria-pressed="${x.id === s.topic}">${x.name}</button>`).join('')}</div>
    <div class="panel reveal"><p class="display">${c.name}</p><p style="line-height:1.6">${esc(c.standard)}</p><p class="sub">Found in ${found.length} sections across ${Object.keys(byDoc).length} documents</p></div>
    ${Object.entries(byDoc).map(([d, ps]) => `<div><strong>${esc(docById(d).title)}</strong>${ps.map(p => srcTile(p.id)).join('')}</div>`).join('')}`;
};
function searchResults() {
  const q = S.search.q.trim();
  if (!q) return '<p class="muted">Try "chain rule", "variance" or "validation".</p>';
  const hits = search(q), docs = new Set(hits.map(h => h.p.docId)).size;
  return `<p class="muted">${hits.length} passage${hits.length === 1 ? '' : 's'} in ${docs} document${docs === 1 ? '' : 's'}</p>` + hits.map(h => {
    const d = docById(h.p.docId);
    return `<button class="panel card-btn" style="flex-direction:column;gap:6px;border:0" data-act="source" data-arg="${h.p.id}" data-hl="${esc([...h.terms].join(','))}"><span class="row-flex" style="width:100%;flex-wrap:nowrap">${docBadge(d, 30)}<strong class="grow">${esc(d.title)}</strong><span class="mono">p. ${h.p.page}</span></span><span class="sub">${esc(h.p.section)}</span><span style="line-height:1.55">${highlight(h.p.text, h.terms)}</span></button>`;
  }).join('');
}

      <div class="legend">${[[V.green, 'Strong'], [V.blue, 'Getting there'], [V.red, 'Gap'], [V.grey, 'Not tested']].map(([c2, l]) => `<span style="--c:${c2}">${l}</span>`).join('')}</div></div>
      <div class="panel"><div class="spread"><p class="display">${c.name}</p>${pill(label, tone)}</div><p class="muted" style="line-height:1.5">${esc(c.simple)}</p><h3>How it connects</h3>

screens.diagnose = () => {
  const d = S.diag, g = gaps();
  let out = `${head('Diagnose & Improve', "Find what you don't understand yet, see why you get questions wrong, then fix exactly that.")}${tabs('diagTab', [`Learning gaps (${g.length})`, 'Diagnostic test', 'Error analysis'], d.tab)}`;
  if (d.tab === 0) {
    return out + `<p class="muted" style="margin:0">Based on ${totalAnswers()} answers from diagnostics, practice, reviews and tests.</p>
      <div class="panel"><h3>Work on these (${g.length})</h3>${g.map(c => mrow(c, `<button class="btn small" data-act="session" data-arg="${c.id}">Fix this</button>`)).join('') || '<p class="muted">No gaps right now.</p>'}</div>
      <div class="panel"><h3>Understood (${CONCEPTS.length - g.length})</h3>${CONCEPTS.filter(c => !isGap(c.id)).map(c => mrow(c)).join('')}</div>`;
  }
  if (d.tab === 1) {
    if (!d.started) return out + `<div class="panel stack"><p class="display">Diagnostic test</p><p class="muted" style="margin:0;line-height:1.5">${d.quiz.length} questions, one per concept, written from your own materials. About 4 minutes. Each answer updates your gaps.</p><div><button class="btn" data-act="diagStart">Start diagnostic</button></div></div>`;
    if (d.idx >= d.quiz.length) return out + `<div class="panel stack"><p class="display">You scored ${d.correct} of ${d.quiz.length}</p><p class="muted" style="margin:0">Your gaps were updated: ${gaps().map(c => c.name).join(', ') || 'none'}.</p><div class="row-flex"><button class="btn" data-act="diagTab" data-arg="0">See my gaps</button><button class="btn outline" data-act="diagTab" data-arg="2">Why I got them wrong</button><button class="btn text" data-act="diagStart">Retake</button></div></div>`;
    const q = d.quiz[d.idx];
    return out + bar(d.idx / d.quiz.length, V.violet) + qcard('diag', q, `Question ${d.idx + 1} of ${d.quiz.length} · ${concept(q.conceptId).name}`, d.idx === d.quiz.length - 1 ? 'See results' : 'Next question');
  }
  if (!L.mistakes.length) return out + '<div class="panel muted">No mistakes recorded yet.</div>';
  const byKind = {}, byC = {};
  L.mistakes.forEach(m => { byKind[m.q.kind] = (byKind[m.q.kind] || 0) + 1; byC[m.q.conceptId] = (byC[m.q.conceptId] || 0) + 1; });
  const kinds = Object.entries(byKind).sort((a, b) => b[1] - a[1]), top = kinds[0];
  return out + `<div class="panel stack"><div class="row-flex" style="flex-wrap:nowrap"><span style="color:var(--amber)">${icon('insights')}</span><h3>${top[1]} of your ${L.mistakes.length} mistakes are about ${KINDS[top[0]][0].toLowerCase()}.</h3></div>
    <p class="muted" style="margin:0;line-height:1.5">${KINDS[top[0]][1]}. Practise questions that ask you to use ideas, not only recall them.</p>
    ${kinds.map(([k, n]) => `<div><div class="spread" style="margin-bottom:6px"><span>${KINDS[k][0]}</span><span class="mono" style="font-size:10.8px">${n}</span></div>${bar(n / L.mistakes.length, V.amber)}</div>`).join('')}
    <p class="sub">Most mistakes by concept: ${Object.entries(byC).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, n]) => `${concept(c).name} (${n})`).join(', ')}</p></div>
    <h2>Recent mistakes</h2>
    ${L.mistakes.slice(0, 8).map((m, i) => `<div class="panel tight"><div class="spread" style="align-items:flex-start"><strong>${esc(m.q.question)}</strong><span class="mono">${ago(m.when)}</span></div>
      <div style="color:var(--red-ink);margin-top:8px">You chose: ${esc(m.q.options[m.chosen])}</div><div style="color:var(--green-ink)">Correct: ${esc(m.q.options[m.q.answer])}</div>
      <div class="row-flex" style="margin-top:10px">${pill(concept(m.q.conceptId).name, 'neutral')}${pill(KINDS[m.q.kind][0], 'amber')}<button class="btn text small" data-act="fixMistake" data-arg="${i}">${icon('wrench', 16)}Fix this mistake</button></div></div>`).join('')}`;
};

function genView() {

function checkView() {
  const c = S.check, r = RUBRICS[c.r], qp = passage(r.passageId), total = r.points.reduce((s, p) => s + p[3], 0);
  let out = `<div class="chips">${RUBRICS.map((x, i) => { const p = passage(x.passageId); return `<button class="chip" data-act="rubric" data-arg="${i}" aria-pressed="${i === c.r}">${docById(p.docId).title.replace('Past exam: ', '')} · ${p.section.split(' (')[0]}</button>`; }).join('')}</div>

    <textarea class="field" id="check-input" data-bind="check.text" rows="6" placeholder="Write your answer as you would in the exam" aria-label="Your answer">${esc(c.text)}</textarea>
    <div class="right"><button class="btn" type="submit">${icon('edit', 18)}Check my answer</button></div></form>`;

      <p class="subtle" style="margin:0">Checked against marking points taken from your materials. Missing points link to where the answer is. An AI model will also judge the quality of your reasoning.</p></div>`;
  }
  return out;

function reviewView() {

/* Study session workflow: 14 targeted learning, 20 remediation, 25 study session */
function openSession(cid, mistake) {
  S.session = { cid, mistake, steps: [...(mistake ? ['Mistake'] : []), 'Learn', 'Practise', 'Test', 'Review'], step: 0, testIdx: 0, testCorrect: 0, before: mastery(cid) };
  delete qc.sp; delete qc.st;
  app.classList.remove('drawer-open');
  render(true, true);
}
function sessionView() {
  const s = S.session, c = concept(s.cid), qs = questionsFor(s.cid), cur = s.steps[s.step];
  let body = '';
  if (cur === 'Mistake') {
    const m = s.mistake, q = m.q;
    body = `<div class="panel"><div style="font-size:15.3px;font-weight:700">${esc(q.question)}</div><div class="opt wrong"><span class="radio"></span>You chose: ${esc(q.options[m.chosen])}</div><div class="opt correct"><span class="radio"></span>Correct: ${esc(q.options[q.answer])}</div>
      <div style="margin-top:12px">${pill('Type of mistake: ' + KINDS[q.kind][0], 'amber')}</div><p class="muted" style="line-height:1.5">${esc(q.explanation)}</p>${srcTile(q.passageId)}</div><div class="right"><button class="btn" data-act="sessNext">Fix the concept behind it</button></div>`;
  } else if (cur === 'Learn') {
    body = `<div class="panel stack"><p class="display">${c.name}</p><div style="background:var(--violet-pale);color:var(--violet-dark);padding:14px;border-radius:12px;line-height:1.5">In one line: ${esc(c.simple)}</div>
      <p style="font-size:13.5px;line-height:1.65;margin:0">${esc(c.standard)}</p><strong>Example</strong><p class="muted" style="margin:-6px 0 0;line-height:1.55">${esc(c.example)}</p>
      <strong>What your materials say</strong><div style="margin-top:-8px">${passagesFor(s.cid).slice(0, 3).map(p => srcTile(p.id)).join('')}</div></div><div class="right"><button class="btn" data-act="sessNext">Practise it</button></div>`;
  } else if (cur === 'Practise') {
    const q = qs.find(x => x !== s.mistake?.q) || qs[0];
    body = qcard('sp', q, 'Practice question · instant feedback', 'Continue to the test');
  } else if (cur === 'Test') {
    body = qcard('st', qs[s.testIdx], `Test · question ${s.testIdx + 1} of ${qs.length}`, s.testIdx === qs.length - 1 ? 'See my review' : 'Next question');
  } else {
    const after = mastery(s.cid), [, col] = mstyle(after);
    body = `<div class="panel stack"><p class="display">Session review</p><strong style="font-size:14.4px">Test: ${s.testCorrect} of ${qs.length} correct</strong>
      <div class="row-flex"><span class="mono" style="font-size:11.7px">Mastery ${pct(s.before)}</span>${icon('arrow', 16)}<span class="mono" style="font-size:11.7px;color:${col};font-weight:700">${pct(after)}</span></div>${bar(after ?? 0, col, true)}
      <p class="muted" style="margin:0;line-height:1.5">${isGap(s.cid) ? `${c.name} is still a gap. Your plan now schedules another session, and it will come back in Review.` : `${c.name} is no longer a gap. It moves to short reviews so you keep it.`}</p>
      <div class="right"><button class="btn" data-act="sessFinish">Finish session</button></div></div>`;
  }
  return `<div class="row-flex"><button class="btn text" data-act="sessExit">← Back</button><strong>${s.mistake ? 'Fix a mistake' : 'Study session'}: ${c.name}</strong></div>
  <div class="stepbar">${s.steps.map((st, i) => `<span class="step${i === s.step ? ' now' : i < s.step ? ' done' : ''}">${i < s.step ? '✓ ' : ''}${i + 1}. ${st}</span>`).join('')}</div>${body}`;
}

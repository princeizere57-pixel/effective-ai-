name: effective_ai
description: Effective AI learning dashboard, ported from the Next.js + Tailwind app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Plus Jakarta Sans, Fraunces, JetBrains Mono (same fonts as tailwind.config.js)
  google_fonts: ^6.2.1
  # Replaces recharts
  fl_chart: ^0.70.2
  # Uploading books, notes, slides, papers and past exams to My Library
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

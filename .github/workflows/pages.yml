name: Deploy to GitHub Pages

# Publishes site/ at https://princeizere57-pixel.github.io/effective-ai-/
#
# site/index.html is the same page as the claude.ai preview
# (https://claude.ai/artifact/BFAscA2o2VrsUk3C2W2SrE), with the standard page
# header (doctype, charset, viewport) that claude.ai adds when serving it, so
# the two look identical. The Flutter app is built and tested separately by CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

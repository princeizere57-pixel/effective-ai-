name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform folder
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name effective_ai --platforms web
          fi

      - run: flutter pub get
      # Fail on errors; style hints and warnings are reported but do not block the build.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: effective-ai-web
          path: build/web

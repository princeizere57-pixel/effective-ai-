name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform folder
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name learnspace --platforms web
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: learnspace-web
          path: build/web
